name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint and TypeScript
        run: npm run lint
      - name: Lint every episode (structure, cues, metadata; no audio or API key needed)
        run: npm run ep:lint
